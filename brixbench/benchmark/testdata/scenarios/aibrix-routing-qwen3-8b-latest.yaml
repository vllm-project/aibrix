# Benchmarks Qwen3-8B PD routing on the latest AIBrix code path.
# 4p4d singlenode + 4p8d multinode (8-GPU cluster: non-4p4d is multinode-only).
Scenario: aibrix-routing-qwen3-8b-latest
Tests:
- name: lat-aibrix-pd-4p4d-singlenode-r8
  provider: aibrix
  fullstack: false
  gateway:
    image:
      baseImage: aibrix-public-release-cn-beijing.cr.volces.com/aibrix/gateway-plugins:v0.6.0
      outputRepository: aibrix-public-release-cn-beijing.cr.volces.com/aibrix/gateway-plugins
    env:
      ROUTING_ALGORITHM: pd
      AIBRIX_PREFIX_CACHE_BLOCK_SIZE: 512
    resources:
    - testdata/deployments/aibrix/gateway/overrides/routing/qwen3-8b-route.yaml
    - testdata/deployments/aibrix/gateway/overrides/routing/qwen3-8b-gateway-resources.yaml
  engine:
    type: vllm
    manifest: testdata/deployments/aibrix/models/qwen3-8b-pd-4p4d-singlenode.yaml
  benchmark: testdata/benchmarks/routing/qwen3-8b-tc-rt-02-pd-4p4d-singlenode-r8-p1000.yaml
  commit: origin/main
- name: lat-aibrix-pd-4p8d-multinode-r8
  provider: aibrix
  fullstack: false
  gateway:
    image:
      baseImage: aibrix-public-release-cn-beijing.cr.volces.com/aibrix/gateway-plugins:v0.6.0
      outputRepository: aibrix-public-release-cn-beijing.cr.volces.com/aibrix/gateway-plugins
    env:
      ROUTING_ALGORITHM: pd
      AIBRIX_PREFIX_CACHE_BLOCK_SIZE: 512
    resources:
    - testdata/deployments/aibrix/gateway/overrides/routing/qwen3-8b-route.yaml
    - testdata/deployments/aibrix/gateway/overrides/routing/qwen3-8b-gateway-resources.yaml
  engine:
    type: vllm
    manifest: testdata/deployments/aibrix/models/qwen3-8b-pd-4p8d-multinode.yaml
  benchmark: testdata/benchmarks/routing/qwen3-8b-tc-rt-02-pd-4p8d-multinode-r8-p1000.yaml
  commit: origin/main
