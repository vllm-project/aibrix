  version: 1.4.0
  platform:
    valuesFile: testdata/deployments/dynamo/platform-aibrix-mirror-v1.4.0.yaml
  engine:
    type: vllm
    manifest: testdata/deployments/dynamo/qwen3-8b-round-robin-4p4d-multinode-v1.4.0.yaml
  benchmark: testdata/benchmarks/routing/qwen3-8b-tc-rt-02-pd-4p4d-multinode-r8-p1000.yaml
- name: dynamo-v1.4.0-qwen3-8b-round-robin-4p4d-multinode-r16
