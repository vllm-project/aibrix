# Dynamo v1.4.0 + vLLM 0.26.0 Qwen3-8B PD routing.
# Official release: https://github.com/ai-dynamo/dynamo/releases/tag/v1.4.0
# Multi-node 4p4d at 8/16 rps with 1000 prompts; TOS publishing is controlled
# externally and must remain disabled for validation runs.
# Router: round-robin. RATE/PROMPTS match the 4p4d singlenode compare scenario
# for direct singlenode vs multinode comparison.
Scenario: dynamo-v1.4.0-routing-qwen3-8b-4p4d-multinode
Tests:
- name: dynamo-v1.4.0-qwen3-8b-round-robin-4p4d-multinode-r8
