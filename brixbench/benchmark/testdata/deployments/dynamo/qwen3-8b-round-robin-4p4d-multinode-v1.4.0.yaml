# vLLM Disaggregated Serving (4P4D multi-node) - Dynamo v1.4.0, VKE
#
# Purpose: Qwen3-8B 4 Prefill + 4 Decode (TP=1) across two nodes for
#          fair comparison with AIBrix/llm-d multi-node 4p4d.
# Usage:   kubectl apply -n brixbench-dynamo -f qwen3-8b-round-robin-4p4d-multinode-v1.4.0.yaml
#
# Node layout (aligned with Dynamo autotest 4p8d split):
#   - Prefill (4): 192.168.0.6
#   - Decode (4) + Frontend: 192.168.0.7
#
# Official evidence: https://github.com/ai-dynamo/dynamo/releases/tag/v1.4.0
# (published 2026-08-15). Runtime is nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
# mirrored to the internal registry. Bundled versions from that release:
# vLLM 0.26.0, CUDA 13.0, NIXL 1.3.2, UCX 1.21.0. Official disagg example still
# uses nvidia.com/v1alpha1. Preserve image-provided NIXL/CUDA library paths.
# Prepending host library paths bypasses CUDA 13 compatibility on the VKE 575
# driver. The official v1.4.0 disagg example omits DYN_HEALTH_CHECK_ENABLED;
# keep it false here so VKE pod Ready does not wait on K8s-injected canaries.
# UCX_NET_DEVICES is auto-detected per pod at startup (ucx_info -d): the VKE
# RDMA CNI wires a different HCA (mlx5_0..7) into each pod, so a static pin
# either silently falls back to TCP (KV transfer ~1s TTFT floor) or crashes.
# GID index pins were dropped after the 2026-07-23 node RDMA recovery.

# vLLM Disaggregated Serving (1P1D) - Dynamo CRD, VKE sample
#
# Purpose: Smoke-test Qwen3-8B with 1 Prefill + 1 Decode (TP=2) on a
#          VKE cluster with local model storage and RDMA.
# Usage:   kubectl apply -n brixbench-dynamo -f qwen3-8b-round-robin-1p1d-tp2-vke.yaml
#
# This VKE fixture intentionally keeps cluster-specific values in YAML, not in
# the Go deployer: PVC, image, nodeSelector, RDMA annotation, and UCX/NIXL env.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: models-pv-brixbench-dynamo
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadOnlyMany
  hostPath:
    path: /root/models
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 500Gi
  volumeName: models-pv-brixbench-dynamo
  storageClassName: ""
---
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-dynamo
spec:
  backendFramework: vllm
  pvcs:
    - name: models-pvc
      create: false

  services:
    Frontend:
      dynamoNamespace: vllm-dynamo
      componentType: frontend
      replicas: 1
      volumeMounts:
        - name: models-pvc
          mountPoint: /models
      extraPodSpec:
        nodeSelector:
          kubernetes.io/hostname: "192.168.0.7"
        mainContainer:
          image: aibrix-container-registry-cn-beijing.cr.volces.com/aibrix/ai-dynamo/vllm-runtime:1.4.0
          workingDir: /workspace
          command:
            - /bin/sh
            - -c
          args:
            - |
              export MODEL=Qwen3-8B
              export ROUTER_MODE=round-robin
              python3 -m dynamo.frontend \
                --model-path /models/$MODEL \
                --router-mode $ROUTER_MODE \
                --router-reset-states

    VllmDecodeWorker:
      dynamoNamespace: vllm-dynamo
      componentType: worker
      subComponentType: decode
      replicas: 4
      extraPodMetadata:
        annotations:
          k8s.volcengine.com/pod-networks: |
            [{"cniConf":{"name":"rdma"}}]
      resources:
        limits:
          gpu: "1"
          custom:
            "vke.volcengine.com/rdma": "1"
        requests:
          gpu: "1"
          custom:
            "vke.volcengine.com/rdma": "1"
      volumeMounts:
        - name: models-pvc
          mountPoint: /models
      extraPodSpec:
        nodeSelector:
          kubernetes.io/hostname: "192.168.0.7"
        mainContainer:
          image: aibrix-container-registry-cn-beijing.cr.volces.com/aibrix/ai-dynamo/vllm-runtime:1.4.0
          workingDir: /workspace
          command:
            - /bin/sh
            - -c
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
          args:
            - |
              ulimit -l unlimited
              RDMA_DEV=$(ucx_info -d 2>/dev/null | sed -n 's/.*Device: \(mlx5_[0-9]*:1\).*/\1/p' | sort -u | head -1)
              if [ -n "$RDMA_DEV" ]; then
                export UCX_NET_DEVICES="${RDMA_DEV},eth1"
                echo "UCX_NET_DEVICES auto-detected: $UCX_NET_DEVICES"
              else
                echo "WARN: ucx_info found no usable mlx5 device; leaving UCX defaults"
              fi
              export MODEL=Qwen3-8B
              export SERVED_MODEL_NAME=qwen3-8b
              export MAX_MODEL_LEN=16384
              export GPU_MEM_UTIL=0.90
              export TP=1
              python3 -m dynamo.vllm \
                --model /models/$MODEL \
                --served-model-name $SERVED_MODEL_NAME \
                --max-model-len $MAX_MODEL_LEN \
                --gpu-memory-utilization $GPU_MEM_UTIL \
                --tensor-parallel-size $TP \
                --disaggregation-mode decode \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          env:
            - name: DYN_LOG
              value: "info"
            - name: DYN_HEALTH_CHECK_ENABLED
              value: "false"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            # UCX_NET_DEVICES is auto-detected per pod in args above (the VKE
            # RDMA CNI wires a different HCA into each pod); no GID index pin
            # after the 2026-07-23 node RDMA recovery changed the GID layout.
            - name: UCX_TLS
              value: "rc_x,rc,cuda_copy,cuda_ipc,tcp"
            - name: UCX_IB_ADDR_TYPE
              value: "eth"
            - name: UCX_RNDV_SCHEME
              value: "get_zcopy"
            - name: UCX_RNDV_THRESH
              value: "0"
            - name: UCX_MEMTYPE_CACHE
              value: "n"
            - name: GLOO_SOCKET_IFNAME
              value: "eth0"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_IB_GID_INDEX
              value: "7"

    VllmPrefillWorker:
      dynamoNamespace: vllm-dynamo
      componentType: worker
      subComponentType: prefill
      replicas: 4
      extraPodMetadata:
        annotations:
          k8s.volcengine.com/pod-networks: |
            [{"cniConf":{"name":"rdma"}}]
      resources:
        limits:
          gpu: "1"
          custom:
            "vke.volcengine.com/rdma": "1"
        requests:
          gpu: "1"
          custom:
            "vke.volcengine.com/rdma": "1"
      volumeMounts:
        - name: models-pvc
          mountPoint: /models
      extraPodSpec:
        nodeSelector:
          kubernetes.io/hostname: "192.168.0.6"
        mainContainer:
          image: aibrix-container-registry-cn-beijing.cr.volces.com/aibrix/ai-dynamo/vllm-runtime:1.4.0
          workingDir: /workspace
          command:
            - /bin/sh
            - -c
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
          args:
            - |
              ulimit -l unlimited
              RDMA_DEV=$(ucx_info -d 2>/dev/null | sed -n 's/.*Device: \(mlx5_[0-9]*:1\).*/\1/p' | sort -u | head -1)
              if [ -n "$RDMA_DEV" ]; then
                export UCX_NET_DEVICES="${RDMA_DEV},eth1"
                echo "UCX_NET_DEVICES auto-detected: $UCX_NET_DEVICES"
              else
                echo "WARN: ucx_info found no usable mlx5 device; leaving UCX defaults"
              fi
              export MODEL=Qwen3-8B
              export SERVED_MODEL_NAME=qwen3-8b
              export MAX_MODEL_LEN=16384
              export GPU_MEM_UTIL=0.90
              export TP=1
              python3 -m dynamo.vllm \
                --model /models/$MODEL \
                --served-model-name $SERVED_MODEL_NAME \
                --max-model-len $MAX_MODEL_LEN \
                --gpu-memory-utilization $GPU_MEM_UTIL \
                --tensor-parallel-size $TP \
                --disaggregation-mode prefill \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}' \
                --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
          env:
            - name: DYN_LOG
              value: "info"
            - name: DYN_HEALTH_CHECK_ENABLED
              value: "false"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            # UCX_NET_DEVICES is auto-detected per pod in args above (the VKE
            # RDMA CNI wires a different HCA into each pod); no GID index pin
            # after the 2026-07-23 node RDMA recovery changed the GID layout.
            - name: UCX_TLS
              value: "rc_x,rc,cuda_copy,cuda_ipc,tcp"
            - name: UCX_IB_ADDR_TYPE
              value: "eth"
            - name: UCX_RNDV_SCHEME
              value: "get_zcopy"
            - name: UCX_RNDV_THRESH
              value: "0"
            - name: UCX_MEMTYPE_CACHE
              value: "n"
            - name: GLOO_SOCKET_IFNAME
              value: "eth0"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_IB_GID_INDEX
              value: "7"
