# llm-d Qwen3-8B PD 4p4d multi-node (Prefill@192.168.0.6, Decode@192.168.0.7)
# Rendered-equivalent llm-d v0.8.1 P/D vLLM modelserver manifest for Brixbench.
# Traceability:
# - guides/pd-disaggregation/modelserver/gpu/vllm/base
# - guides/recipes/modelserver/base/single-host/pd/vllm
# - guides/recipes/modelserver/components/images/gpu-vllm
# - guides/recipes/modelserver/components/images/routing-sidecar
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pd-disaggregation-nvidia-gpu-vllm-sa
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-disaggregation-nvidia-gpu-vllm-prefill
  labels:
    llm-d.ai/role: prefill
    llm-d.ai/model: qwen3-8b
    llm-d.ai/guide: pd-disaggregation
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/engine-type: vllm
spec:
  replicas: 4
  selector:
    matchLabels:
      llm-d.ai/role: prefill
      llm-d.ai/model: qwen3-8b
      llm-d.ai/guide: pd-disaggregation
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/engine-type: vllm
  template:
    metadata:
      annotations:
        k8s.volcengine.com/pod-networks: |
          [{"cniConf":{"name":"rdma"}}]
      labels:
        llm-d.ai/role: prefill
        llm-d.ai/model: qwen3-8b
        llm-d.ai/guide: pd-disaggregation
        llm-d.ai/accelerator-variant: gpu
        llm-d.ai/accelerator-vendor: nvidia
        llm-d.ai/engine-type: vllm
    spec:
      serviceAccountName: pd-disaggregation-nvidia-gpu-vllm-sa
      imagePullSecrets:
        - name: aibrix-registry-secret
      nodeSelector:
        kubernetes.io/hostname: 192.168.0.6
      containers:
        - name: modelserver
          image: aibrix-container-registry-cn-beijing.cr.volces.com/aibrix/llmd-vllm-openai:v0.23.0
          command: ["vllm", "serve"]
          args:
            - "/models/Qwen3-8B"
            - "--served-model-name=qwen3-8b"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size=1"
            - "--block-size=128"
            - "--kv-transfer-config"
            - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
            - "--no-disable-hybrid-kv-cache-manager"
            - "--max-model-len=16384"
          env:
            - name: USER
              value: llm-d
            - name: UCX_TLS
              value: "^gga"
            - name: GLOO_SOCKET_IFNAME
              value: "eth0"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_IB_GID_INDEX
              value: "7"
            - name: NCCL_DEBUG
              value: "INFO"
            - name: PYTHONHASHSEED
              value: "1047"
            - name: VLLM_NIXL_ABORT_REQUEST_TIMEOUT
              value: "600"
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "5600"
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "120"
            - name: VLLM_SERVER_DEV_MODE
              value: "1"
            - name: VLLM_USE_V1
              value: "1"
            - name: VLLM_ENABLE_V1_MULTIPROCESSING
              value: "1"
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: "spawn"
            - name: UCX_LOG_LEVEL
              value: info
            - name: NIXL_LOG_LEVEL
              value: info
            - name: VLLM_LOGGING_LEVEL
              value: info
          ports:
            - name: modelserver
              containerPort: 8000
              protocol: TCP
            - name: nixl
              containerPort: 5600
              protocol: TCP
          resources:
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
              vke.volcengine.com/rdma: "1"
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: /models
              name: model-vol
              readOnly: true
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.config
              name: vllm-config
            - mountPath: /.triton
              name: triton-cache
          startupProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
      volumes:
        - name: model-vol
          hostPath:
            path: /data01/models
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: torch-compile-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
