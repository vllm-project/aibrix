name: Docker Push Images

on:
  workflow_dispatch:  # Allows manual trigger
  push:
    branches: [ "main", "release-*" ]
    # Docs, samples and benchmarks changes don't need new images.
    paths-ignore:
      - 'docs/**'
      - 'samples/**'
      - 'benchmarks/**'
      - '**/*.md'
      - '**/*.rst'

# When merges land close together, build only the newest one: the running
# build finishes, and a newer push replaces any build still waiting to start.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Each image is built once and pushed to both Docker Hub and GHCR.
  build-push:
    if: github.repository == 'vllm-project/aibrix'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        component:
          - name: controller-manager
            file: build/container/Dockerfile
          - name: gateway-plugins
            file: build/container/Dockerfile.gateway
          - name: metadata-service
            file: build/container/Dockerfile.python
            target: metadata-service
          - name: runtime
            file: build/container/Dockerfile.python
            target: runtime
          - name: kvcache-watcher
            file: build/container/Dockerfile.kvcache
          - name: vllm-mock
            file: development/app/Dockerfile
            context: development/app
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Login to Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.AIBRIX_ORG_PACKAGE_UPDATE_GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: ${{ matrix.component.context || '.' }}
          file: ${{ matrix.component.file }}
          target: ${{ matrix.component.target || '' }}
          push: true
          tags: |
            aibrix/${{ matrix.component.name }}:${{ github.sha }}
            aibrix/${{ matrix.component.name }}:nightly
            ghcr.io/aibrix/${{ matrix.component.name }}:${{ github.sha }}
            ghcr.io/aibrix/${{ matrix.component.name }}:nightly
