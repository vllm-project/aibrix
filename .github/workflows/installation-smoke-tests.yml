name: Installation Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "release-*"]
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'build/container/**'
      - 'config/**'
      - 'development/app/**'
      - 'dist/chart/**'
      - 'pkg/**'
      - 'test/**'
      - 'cmd/**'
      - 'python/**'
      - 'hack/ci/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'

# Cancel superseded pull-request runs so the newest push starts first.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-images:
    name: Build smoke image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: controller-manager
            dockerfile: build/container/Dockerfile
            context: .
          - image: gateway-plugins
            dockerfile: build/container/Dockerfile.gateway
            context: .
          - image: runtime
            dockerfile: build/container/Dockerfile.python
            context: .
          - image: metadata-service
            dockerfile: build/container/Dockerfile.python
            context: .
          - image: vllm-mock
            dockerfile: development/app/Dockerfile
            context: development/app
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: aibrix/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=installation-smoke-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=installation-smoke-${{ matrix.image }}
          load: true

      - name: Save image
        run: docker save "aibrix/${{ matrix.image }}:${{ github.sha }}" > "${{ matrix.image }}.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image }}-image
          path: ${{ matrix.image }}.tar
          retention-days: 1

  kustomize-install-smoke:
    name: Installation Smoke / Kustomize
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KIND_CLUSTER_NAME: installation-smoke-kustomize
      KUBECONFIG: /tmp/installation-smoke-kustomize.conf
      AIBRIX_E2E_GATEWAY_URL: http://127.0.0.1:8888
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Cache Kind and Kustomize
        uses: actions/cache@v5
        with:
          path: |
            /tmp/tools/kind
            /tmp/tools/kustomize
          key: installation-smoke-kind-v0.24.0-kustomize-v5.4.3-${{ runner.os }}-${{ runner.arch }}

      - name: Install Kind and Kustomize
        run: |
          set -euo pipefail
          mkdir -p /tmp/tools
          if [ ! -f /tmp/tools/kind ]; then
            curl -fsSLo /tmp/tools/kind "https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64"
            chmod +x /tmp/tools/kind
          fi
          if [ ! -f /tmp/tools/kustomize ]; then
            curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" |
              tar -xz -C /tmp/tools kustomize
            chmod +x /tmp/tools/kustomize
          fi
          sudo cp /tmp/tools/kind /tmp/tools/kustomize /usr/local/bin/
          kind version
          kustomize version

      - name: Download image artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-image'
          merge-multiple: false

      - name: Verify image artifacts
        run: |
          set -euo pipefail
          for image in controller-manager gateway-plugins runtime metadata-service vllm-mock; do
            path="${image}-image/${image}.tar"
            if [ ! -s "${path}" ]; then
              echo "::error::Required image artifact ${path} is missing or empty"
              exit 1
            fi
          done

      - name: Free disk space
        run: |
          sudo rm -rf \
            /opt/google/chrome \
            /opt/microsoft/msedge \
            /opt/microsoft/powershell \
            /opt/pipx \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift
          df -h /

      - name: Create isolated Kind cluster
        run: |
          set -euo pipefail
          kind create cluster --name "${KIND_CLUSTER_NAME}" --config hack/ci/kind-config.yaml --wait 5m
          kind get kubeconfig --name "${KIND_CLUSTER_NAME}" > "${KUBECONFIG}"
          if ! kubectl cluster-info; then
            echo "::error::Kind cluster ${KIND_CLUSTER_NAME} is not reachable"
            exit 1
          fi

      - name: Load current pull-request images
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          for image in controller-manager gateway-plugins runtime metadata-service vllm-mock; do
            docker load < "${image}-image/${image}.tar"
            docker tag "aibrix/${image}:${sha}" "aibrix/${image}:nightly"
          done
          kind load docker-image \
            "aibrix/controller-manager:${sha}" "aibrix/controller-manager:nightly" \
            "aibrix/gateway-plugins:${sha}" "aibrix/gateway-plugins:nightly" \
            "aibrix/runtime:${sha}" "aibrix/runtime:nightly" \
            "aibrix/metadata-service:${sha}" "aibrix/metadata-service:nightly" \
            "aibrix/vllm-mock:${sha}" "aibrix/vllm-mock:nightly" \
            --name "${KIND_CLUSTER_NAME}"

      - name: Install dependencies, CRDs, and AIBrix with Kustomize
        run: |
          set -euo pipefail
          kubectl apply -k config/dependency --server-side
          if ! kubectl -n envoy-gateway-system rollout status deployment/envoy-gateway --timeout=5m; then
            echo "::error::Envoy Gateway deployment did not become Available"
            exit 1
          fi

          kubectl apply -k config/crd --server-side
          wait_for_crd() {
            local crd="$1"
            local deadline=$((SECONDS + 300))
            until kubectl wait --for=condition=Established "crd/${crd}" --timeout=15s; do
              if ((SECONDS >= deadline)); then
                echo "::error::CRD ${crd} did not become Established within 5 minutes"
                kubectl get "crd/${crd}" -o yaml
                return 1
              fi
            done
          }
          for crd in \
            stormservices.orchestration.aibrix.ai \
            rolesets.orchestration.aibrix.ai \
            podsets.orchestration.aibrix.ai; do
            wait_for_crd "${crd}"
          done

          pushd config/default
          kustomize edit set image "controller=aibrix/controller-manager:${{ github.sha }}"
          kustomize edit set image "gateway-plugins=aibrix/gateway-plugins:${{ github.sha }}"
          kustomize edit set image "metadata-service=aibrix/metadata-service:${{ github.sha }}"
          popd
          kubectl apply -k config/test

      - name: Wait for Kustomize control plane
        run: |
          set -euo pipefail
          for deployment in \
            aibrix-controller-manager \
            aibrix-gateway-plugins \
            aibrix-metadata-service \
            aibrix-redis-master; do
            if ! kubectl -n aibrix-system rollout status "deployment/${deployment}" --timeout=10m; then
              echo "::error::Deployment ${deployment} did not become Available"
              exit 1
            fi
          done
          for service in \
            aibrix-gateway-plugins \
            aibrix-metadata-service \
            aibrix-redis-master \
            aibrix-webhook-service; do
            if ! kubectl -n aibrix-system get "service/${service}"; then
              echo "::error::Required Service ${service} does not exist"
              exit 1
            fi
          done
          if ! kubectl get mutatingwebhookconfiguration/aibrix-mutating-webhook-configuration; then
            echo "::error::Webhook configuration aibrix-mutating-webhook-configuration does not exist"
            exit 1
          fi
          if ! kubectl get validatingwebhookconfiguration/aibrix-validating-webhook-configuration; then
            echo "::error::Webhook configuration aibrix-validating-webhook-configuration does not exist"
            exit 1
          fi
          if ! kubectl -n aibrix-system wait \
            --for=jsonpath='{.subsets[0].addresses[0].ip}' \
            endpoints/aibrix-webhook-service --timeout=5m; then
            echo "::error::Webhook Service aibrix-webhook-service has no ready endpoint"
            exit 1
          fi
          if ! kubectl -n aibrix-system wait \
            --for=jsonpath='{.status.listeners[0].conditions[?(@.type=="Programmed")].status}'=True \
            gateway/aibrix-eg --timeout=5m; then
            echo "::error::Gateway aibrix-eg listener did not become Programmed"
            exit 1
          fi
          kubectl -n aibrix-system get deployments -o custom-columns=NAME:.metadata.name,IMAGES:.spec.template.spec.containers[*].image

      - name: Run shared StormService smoke test
        run: |
          set -euo pipefail
          gateway_service="$(kubectl -n envoy-gateway-system get services -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' |
            grep '^envoy-aibrix-system-aibrix-eg-' | head -n 1)"
          if [ -z "${gateway_service}" ]; then
            echo "::error::Envoy data-plane Service for Gateway aibrix-eg was not found"
            exit 1
          fi
          kubectl -n envoy-gateway-system port-forward "service/${gateway_service}" 8888:80 > "${RUNNER_TEMP}/gateway-port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "${port_forward_pid}" 2>/dev/null || true' EXIT
          if ! timeout 60 bash -c 'until curl -sS -o /dev/null http://127.0.0.1:8888/; do sleep 2; done'; then
            echo "::error::Gateway port-forward did not become reachable"
            cat "${RUNNER_TEMP}/gateway-port-forward.log"
            exit 1
          fi
          make test-install-smoke

      - name: Collect Kustomize failure diagnostics
        if: failure()
        run: |
          set +e
          diagnostics="${RUNNER_TEMP}/installation-smoke-kustomize"
          mkdir -p "${diagnostics}"
          kubectl get pods -A -o wide > "${diagnostics}/pods.txt" 2>&1
          kubectl get events -A --sort-by='.lastTimestamp' > "${diagnostics}/events.txt" 2>&1
          kubectl get deployments,services -A -o wide > "${diagnostics}/workloads.txt" 2>&1
          kubectl get crd > "${diagnostics}/crds.txt" 2>&1
          kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations -o yaml > "${diagnostics}/webhooks.yaml" 2>&1
          kubectl describe pods -A > "${diagnostics}/pod-descriptions.txt" 2>&1
          kubectl -n aibrix-system logs deployment/aibrix-controller-manager --all-containers --tail=-1 > "${diagnostics}/controller.log" 2>&1
          kubectl -n aibrix-system logs deployment/aibrix-gateway-plugins --all-containers --tail=-1 > "${diagnostics}/gateway-plugin.log" 2>&1
          kubectl -n aibrix-system logs deployment/aibrix-metadata-service --all-containers --tail=-1 > "${diagnostics}/metadata.log" 2>&1
          kubectl -n default logs -l 'model.aibrix.ai/name' --all-containers --tail=-1 > "${diagnostics}/mock-runtime.log" 2>&1
          cp "${RUNNER_TEMP}/gateway-port-forward.log" "${diagnostics}/" 2>/dev/null || true
          kind export logs "${diagnostics}/kind" --name "${KIND_CLUSTER_NAME}"

      - name: Upload Kustomize failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kind-installation-smoke-kustomize-logs
          path: ${{ runner.temp }}/installation-smoke-kustomize
          retention-days: 7

      - name: Delete Kustomize Kind cluster
        if: always()
        continue-on-error: true
        run: kind delete cluster --name "${KIND_CLUSTER_NAME}"

  helm-install-smoke:
    name: Installation Smoke / Helm
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KIND_CLUSTER_NAME: installation-smoke-helm
      KUBECONFIG: /tmp/installation-smoke-helm.conf
      AIBRIX_E2E_GATEWAY_URL: http://127.0.0.1:8888
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.17.0

      - name: Cache Kind and Kustomize
        uses: actions/cache@v5
        with:
          path: |
            /tmp/tools/kind
            /tmp/tools/kustomize
          key: installation-smoke-kind-v0.24.0-kustomize-v5.4.3-${{ runner.os }}-${{ runner.arch }}

      - name: Install Kind and Kustomize
        run: |
          set -euo pipefail
          mkdir -p /tmp/tools
          if [ ! -f /tmp/tools/kind ]; then
            curl -fsSLo /tmp/tools/kind "https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64"
            chmod +x /tmp/tools/kind
          fi
          if [ ! -f /tmp/tools/kustomize ]; then
            curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" |
              tar -xz -C /tmp/tools kustomize
            chmod +x /tmp/tools/kustomize
          fi
          sudo cp /tmp/tools/kind /tmp/tools/kustomize /usr/local/bin/
          kind version
          kustomize version

      - name: Download image artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-image'
          merge-multiple: false

      - name: Verify image artifacts
        run: |
          set -euo pipefail
          for image in controller-manager gateway-plugins runtime metadata-service vllm-mock; do
            path="${image}-image/${image}.tar"
            if [ ! -s "${path}" ]; then
              echo "::error::Required image artifact ${path} is missing or empty"
              exit 1
            fi
          done

      - name: Free disk space
        run: |
          sudo rm -rf \
            /opt/google/chrome \
            /opt/microsoft/msedge \
            /opt/microsoft/powershell \
            /opt/pipx \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift
          df -h /

      - name: Create isolated Kind cluster
        run: |
          set -euo pipefail
          kind create cluster --name "${KIND_CLUSTER_NAME}" --config hack/ci/kind-config.yaml --wait 5m
          kind get kubeconfig --name "${KIND_CLUSTER_NAME}" > "${KUBECONFIG}"
          if ! kubectl cluster-info; then
            echo "::error::Kind cluster ${KIND_CLUSTER_NAME} is not reachable"
            exit 1
          fi

      - name: Load current pull-request images
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          for image in controller-manager gateway-plugins runtime metadata-service vllm-mock; do
            docker load < "${image}-image/${image}.tar"
            docker tag "aibrix/${image}:${sha}" "aibrix/${image}:nightly"
          done
          kind load docker-image \
            "aibrix/controller-manager:${sha}" "aibrix/controller-manager:nightly" \
            "aibrix/gateway-plugins:${sha}" "aibrix/gateway-plugins:nightly" \
            "aibrix/runtime:${sha}" "aibrix/runtime:nightly" \
            "aibrix/metadata-service:${sha}" "aibrix/metadata-service:nightly" \
            "aibrix/vllm-mock:${sha}" "aibrix/vllm-mock:nightly" \
            --name "${KIND_CLUSTER_NAME}"

      - name: Install Envoy Gateway
        run: |
          set -euo pipefail
          kubectl apply -k config/dependency/envoy-gateway --server-side
          if ! kubectl -n envoy-gateway-system rollout status deployment/envoy-gateway --timeout=5m; then
            echo "::error::Envoy Gateway deployment did not become Available"
            exit 1
          fi

      - name: Install CRDs and local Helm chart
        run: |
          set -euo pipefail
          kubectl apply -f dist/chart/crds --server-side
          wait_for_crd() {
            local crd="$1"
            local deadline=$((SECONDS + 300))
            until kubectl wait --for=condition=Established "crd/${crd}" --timeout=15s; do
              if ((SECONDS >= deadline)); then
                echo "::error::CRD ${crd} did not become Established within 5 minutes"
                kubectl get "crd/${crd}" -o yaml
                return 1
              fi
            done
          }
          for crd in \
            stormservices.orchestration.aibrix.ai \
            rolesets.orchestration.aibrix.ai \
            podsets.orchestration.aibrix.ai; do
            wait_for_crd "${crd}"
          done

          helm install aibrix dist/chart \
            --namespace aibrix-system \
            --create-namespace \
            --skip-crds \
            --timeout 10m \
            --wait \
            --set "controllerManager.container.image.repository=aibrix/controller-manager" \
            --set "controllerManager.container.image.tag=${{ github.sha }}" \
            --set "gatewayPlugin.container.image.repository=aibrix/gateway-plugins" \
            --set "gatewayPlugin.container.image.tag=${{ github.sha }}" \
            --set "metadata.service.container.image.repository=aibrix/metadata-service" \
            --set "metadata.service.container.image.tag=${{ github.sha }}" \
            --set "gpuOptimizer.container.image.repository=aibrix/metadata-service" \
            --set "gpuOptimizer.container.image.tag=${{ github.sha }}"

      - name: Wait for Helm control plane
        run: |
          set -euo pipefail
          for deployment in \
            aibrix-controller-manager \
            aibrix-gateway-plugins \
            aibrix-metadata-service \
            aibrix-redis-master; do
            if ! kubectl -n aibrix-system rollout status "deployment/${deployment}" --timeout=10m; then
              echo "::error::Deployment ${deployment} did not become Available"
              exit 1
            fi
          done
          for service in \
            aibrix-gateway-plugins \
            aibrix-metadata-service \
            aibrix-redis-master \
            aibrix-webhook-service; do
            if ! kubectl -n aibrix-system get "service/${service}"; then
              echo "::error::Required Service ${service} does not exist"
              exit 1
            fi
          done
          if ! kubectl get mutatingwebhookconfiguration/aibrix-mutating-webhook-configuration; then
            echo "::error::Webhook configuration aibrix-mutating-webhook-configuration does not exist"
            exit 1
          fi
          if ! kubectl get validatingwebhookconfiguration/aibrix-validating-webhook-configuration; then
            echo "::error::Webhook configuration aibrix-validating-webhook-configuration does not exist"
            exit 1
          fi
          if ! kubectl -n aibrix-system wait \
            --for=jsonpath='{.subsets[0].addresses[0].ip}' \
            endpoints/aibrix-webhook-service --timeout=5m; then
            echo "::error::Webhook Service aibrix-webhook-service has no ready endpoint"
            exit 1
          fi
          if ! kubectl -n aibrix-system wait \
            --for=jsonpath='{.status.listeners[0].conditions[?(@.type=="Programmed")].status}'=True \
            gateway/aibrix-eg --timeout=5m; then
            echo "::error::Gateway aibrix-eg listener did not become Programmed"
            exit 1
          fi
          kubectl -n aibrix-system get deployments -o custom-columns=NAME:.metadata.name,IMAGES:.spec.template.spec.containers[*].image

      - name: Run shared StormService smoke test
        run: |
          set -euo pipefail
          gateway_service="$(kubectl -n envoy-gateway-system get services -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' |
            grep '^envoy-aibrix-system-aibrix-eg-' | head -n 1)"
          if [ -z "${gateway_service}" ]; then
            echo "::error::Envoy data-plane Service for Gateway aibrix-eg was not found"
            exit 1
          fi
          kubectl -n envoy-gateway-system port-forward "service/${gateway_service}" 8888:80 > "${RUNNER_TEMP}/gateway-port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "${port_forward_pid}" 2>/dev/null || true' EXIT
          if ! timeout 60 bash -c 'until curl -sS -o /dev/null http://127.0.0.1:8888/; do sleep 2; done'; then
            echo "::error::Gateway port-forward did not become reachable"
            cat "${RUNNER_TEMP}/gateway-port-forward.log"
            exit 1
          fi
          make test-install-smoke

      - name: Collect Helm failure diagnostics
        if: failure()
        run: |
          set +e
          diagnostics="${RUNNER_TEMP}/installation-smoke-helm"
          mkdir -p "${diagnostics}"
          kubectl get pods -A -o wide > "${diagnostics}/pods.txt" 2>&1
          kubectl get events -A --sort-by='.lastTimestamp' > "${diagnostics}/events.txt" 2>&1
          kubectl get deployments,services -A -o wide > "${diagnostics}/workloads.txt" 2>&1
          kubectl get crd > "${diagnostics}/crds.txt" 2>&1
          kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations -o yaml > "${diagnostics}/webhooks.yaml" 2>&1
          kubectl describe pods -A > "${diagnostics}/pod-descriptions.txt" 2>&1
          kubectl -n aibrix-system logs deployment/aibrix-controller-manager --all-containers --tail=-1 > "${diagnostics}/controller.log" 2>&1
          kubectl -n aibrix-system logs deployment/aibrix-gateway-plugins --all-containers --tail=-1 > "${diagnostics}/gateway-plugin.log" 2>&1
          kubectl -n aibrix-system logs deployment/aibrix-metadata-service --all-containers --tail=-1 > "${diagnostics}/metadata.log" 2>&1
          kubectl -n default logs -l 'model.aibrix.ai/name' --all-containers --tail=-1 > "${diagnostics}/mock-runtime.log" 2>&1
          cp "${RUNNER_TEMP}/gateway-port-forward.log" "${diagnostics}/" 2>/dev/null || true
          kind export logs "${diagnostics}/kind" --name "${KIND_CLUSTER_NAME}"

      - name: Upload Helm failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kind-installation-smoke-helm-logs
          path: ${{ runner.temp }}/installation-smoke-helm
          retention-days: 7

      - name: Delete Helm Kind cluster
        if: always()
        continue-on-error: true
        run: kind delete cluster --name "${KIND_CLUSTER_NAME}"
