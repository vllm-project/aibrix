name: Linter and Unit Tests

on:
  workflow_dispatch:  # Allows manual trigger
  push:
    # PRs already test against the latest main, so merges don't re-run this.
    branches: [ "release-*" ]
    paths:
      - '.github/workflows/**'
      - 'pkg/**'
      - 'apps/**'
      - 'test/**'
      - 'cmd/**'
      - 'api/**'
      - 'config/crd/**'
      - 'config/rbac/controller-manager/**'
      - 'dist/chart/crds/**'
      - 'dist/chart/templates/controller-manager/rbac.yaml'
      - 'dist/chart/templates/*.tpl'
      - 'dist/chart/values.yaml'
      - 'dist/chart/values.schema.json'
      - 'dist/chart/Chart.yaml'
      - 'hack/verify-crd-sync.sh'
      - 'hack/verify-rbac.sh'
      - 'hack/verify-rbac/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.golangci.yml'
      - '!**/*.md'
      - '!**/*.rst'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - 'pkg/**'
      - 'apps/**'
      - 'test/**'
      - 'cmd/**'
      - 'api/**'
      - 'config/crd/**'
      - 'config/rbac/controller-manager/**'
      - 'dist/chart/crds/**'
      - 'dist/chart/templates/controller-manager/rbac.yaml'
      - 'dist/chart/templates/*.tpl'
      - 'dist/chart/values.yaml'
      - 'dist/chart/values.schema.json'
      - 'dist/chart/Chart.yaml'
      - 'hack/verify-crd-sync.sh'
      - 'hack/verify-rbac.sh'
      - 'hack/verify-rbac/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.golangci.yml'
      - '!**/*.md'
      - '!**/*.rst'

# Cancel superseded pull-request runs so the newest push starts first.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, codegen checks, unit and race tests, and coverage share one runner.
  # Together they finish in about the time the integration job takes, so the
  # workflow is no slower, and it holds two runners from the org's shared
  # pool instead of six.
  lint-and-unit-test:
    name: Go Lint and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      # golangci-lint needs a newer Go than the rest of the build.
      - name: Set up Go for lint
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Lint
        run: make lint-all

      # The steps below run even if an earlier one failed, so one run still
      # reports every lint, codegen and test failure.
      - name: Set up Go
        if: ${{ !cancelled() }}
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - name: Verify Codegen
        if: ${{ !cancelled() }}
        run: bash ${GITHUB_WORKSPACE}/hack/verify-codegen.sh
      - name: Generate CRDs
        id: manifests
        if: ${{ !cancelled() }}
        run: make manifests
      - name: Verify CRD Synchronization
        if: ${{ !cancelled() }}
        run: bash ${GITHUB_WORKSPACE}/hack/verify-crd-sync.sh

      - name: Set up Helm for RBAC verification
        id: rbac_helm
        if: ${{ !cancelled() && steps.manifests.outcome == 'success' }}
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.18.6
      - name: Verify RBAC Synchronization
        if: ${{ !cancelled() && steps.manifests.outcome == 'success' && steps.rbac_helm.outcome == 'success' }}
        run: make verify-rbac

      - name: Install ZMQ dependencies
        if: ${{ !cancelled() }}
        run: sudo apt-get update && sudo apt-get install -y pkg-config libkrb5-dev libzmq3-dev

      # github action has errors, requires debugging
      # - name: Cache Go modules
      #   uses: actions/cache@v5
      #   with:
      #     path: |
      #       ~/.cache/go-build
      #       ~/go/pkg/mod
      #     key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      #     restore-keys: |
      #       ${{ runner.os }}-go-

      # One pass with -race also writes cover.out, so the unit tests no longer
      # run twice over the same packages.
      - name: Run Unit Tests with Race Detection
        id: unit-test
        if: ${{ !cancelled() }}
        run: make test-race-condition

      - name: Run ZMQ Tests
        if: ${{ !cancelled() }}
        run: make test-zmq

      - name: check test coverage
        id: coverage
        if: ${{ !cancelled() && steps.unit-test.outcome == 'success' }}
        uses: vladopajic/go-test-coverage@v2
        continue-on-error: true # Should fail after coverage comment is posted
        with:
          config: ./.github/.testcoverage.yml
          profile: cover.out

          # temporary overrides until we reach our goal of 90%
          threshold-file: 0
          threshold-package: 0
          threshold-total: 55

      - name: "finally check coverage"
        if: ${{ !cancelled() && steps.coverage.outcome == 'failure' }}
        shell: bash
        run: echo "coverage check failed" && exit 1

      # getting error: https://github.com/thollander/actions-comment-pull-request?tab=readme-ov-file#permissions
      # requires a change from pull_request to pull_request_target.
      # - name: post coverage report
      #   uses: thollander/actions-comment-pull-request@v3
      #   with:
      #     # github-token: ${{ secrets.GITHUB_TOKEN }}
      #     comment-tag: coverage-report
      #     message: |
      #       go-test-coverage report:
      #       ```
      #       ${{ fromJSON(steps.coverage.outputs.report) }}```

  integration-test:
    name: Go Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - name: Install ZMQ dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libzmq3-dev
      - name: Run Integration Tests
        run: make test-integration
      - name: Run Integration-Tagged Go Tests
        run: make test-integration-tagged
