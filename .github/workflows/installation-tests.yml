name: Installation Tests

on:
  workflow_dispatch:  # Allows manual trigger
  push:
    # PRs already test against the latest main, so merges don't re-run this.
    branches: [ "release-*" ]
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'build/container/**'
      - 'config/**'
      - 'development/app/**'
      - 'pkg/**'
      - 'test/**'
      - 'cmd/**'
      - 'python/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'hack/ci/**'
      - '!**/*.md'
      - '!**/*.rst'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [ "main", "release-*" ]
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'build/container/**'
      - 'config/**'
      - 'development/app/**'
      - 'pkg/**'
      - 'test/**'
      - 'cmd/**'
      - 'python/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'hack/ci/**'
      - '!**/*.md'
      - '!**/*.rst'

# Cancel superseded pull-request runs so the newest push starts first. A run
# started by any label other than ci-approved does nothing, so it gets its own
# group and cancels nothing.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event.action != 'labeled' || github.event.label.name == 'ci-approved') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-approval:
    name: CI Approval
    if: github.event.action != 'labeled' || github.event.label.name == 'ci-approved'
    permissions:
      pull-requests: read
    uses: ./.github/workflows/ci-approval.yml

  installation-test:
    name: Installation E2E Tests
    needs: [ci-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Free disk space
        run: |-
          # https://github.com/actions/runner-images/issues/2840#issuecomment-2272410832
          # Remove software and language runtimes we're not using
          sudo rm -rf \
            /opt/google/chrome \
            /opt/microsoft/msedge \
            /opt/microsoft/powershell \
            /opt/pipx \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The images are built one after another on this runner and loaded
      # straight into Docker, instead of in separate jobs that hand tarballs
      # over as artifacts.
      - name: Build controller-manager
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/container/Dockerfile
          tags: aibrix/controller-manager:${{ github.sha }}
          cache-from: type=gha,scope=controller-manager
          cache-to: type=gha,mode=max,scope=controller-manager
          load: true

      - name: Build gateway-plugins
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/container/Dockerfile.gateway
          tags: aibrix/gateway-plugins:${{ github.sha }}
          cache-from: type=gha,scope=gateway-plugins
          cache-to: type=gha,mode=max,scope=gateway-plugins
          load: true

      - name: Build runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/container/Dockerfile.python
          target: runtime
          tags: aibrix/runtime:${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
          load: true

      - name: Build metadata-service
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/container/Dockerfile.python
          target: metadata-service
          tags: aibrix/metadata-service:${{ github.sha }}
          cache-from: type=gha,scope=metadata-service
          cache-to: type=gha,mode=max,scope=metadata-service
          load: true

      - name: Build vllm-mock
        uses: docker/build-push-action@v7
        with:
          context: development/app
          file: development/app/Dockerfile
          tags: aibrix/vllm-mock:${{ github.sha }}
          cache-from: type=gha,scope=vllm-mock
          cache-to: type=gha,mode=max,scope=vllm-mock
          load: true

      - name: Cache kind
        id: cache-kind
        uses: actions/cache@v5
        with:
          path: /tmp/tools/kind
          key: kind-v0.24.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install kind
        run: |
          if [ ! -f /tmp/tools/kind ]; then
            mkdir -p /tmp/tools
            [ $(uname -m) = x86_64 ] && curl -Lo /tmp/tools/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
            chmod +x /tmp/tools/kind
          fi
          sudo cp /tmp/tools/kind /usr/local/bin/kind
          kind version

      - name: Cache kustomize
        id: cache-kustomize
        uses: actions/cache@v5
        with:
          path: /tmp/tools/kustomize
          key: kustomize-v5.4.3-${{ runner.os }}-${{ runner.arch }}

      - name: Install kustomize
        run: |
          if [ ! -f /tmp/tools/kustomize ]; then
            mkdir -p /tmp/tools
            curl -L https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.3/kustomize_v5.4.3_$(go env GOOS)_$(go env GOARCH).tar.gz | tar -xz -C /tmp/tools/
            chmod +x /tmp/tools/kustomize
          fi
          sudo cp /tmp/tools/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Set up testing environment
        run: |
          # Set up the cluster with kind or other Kubernetes environment needed
          kind create cluster --name installation-test --config=./hack/ci/kind-config-installation.yaml
          kubectl cluster-info --context kind-installation-test

      - name: Load images into kind
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          # Same digest as :sha; manifests still reference :nightly in places (e.g. job templates).
          for image in controller-manager gateway-plugins runtime metadata-service vllm-mock; do
            docker tag "aibrix/${image}:${sha}" "aibrix/${image}:nightly"
          done

          # One kind load transfers all refs to the cluster nodes (two invocations duplicated work).
          kind load docker-image \
            "aibrix/controller-manager:${sha}" "aibrix/controller-manager:nightly" \
            "aibrix/gateway-plugins:${sha}" "aibrix/gateway-plugins:nightly" \
            "aibrix/metadata-service:${sha}" "aibrix/metadata-service:nightly" \
            "aibrix/runtime:${sha}" "aibrix/runtime:nightly" \
            "aibrix/vllm-mock:${sha}" "aibrix/vllm-mock:nightly" \
            --name installation-test

          docker build \
            --build-arg INPLACE_E2E_VERSION=v1 \
            -t aibrix/inplace-e2e:v1 \
            -f test/e2e/controller/roleset/inplace-image/Dockerfile \
            test/e2e/controller/roleset/inplace-image
          docker build \
            --build-arg INPLACE_E2E_VERSION=v2 \
            -t aibrix/inplace-e2e:v2 \
            -f test/e2e/controller/roleset/inplace-image/Dockerfile \
            test/e2e/controller/roleset/inplace-image
          kind load docker-image \
            aibrix/inplace-e2e:v1 \
            aibrix/inplace-e2e:v2 \
            --name installation-test

          docker build \
            -t aibrix/external-router-e2e:nightly \
            -f test/e2e/gateway/routing/testdata/external-router/Dockerfile \
            test/e2e/gateway/routing/testdata/external-router
          kind load docker-image \
            aibrix/external-router-e2e:nightly \
            --name installation-test

      - name: Deploy AIBrix control plane
        run: |
          kubectl apply -k config/dependency --server-side
          kubectl apply -k config/crd --server-side
          cd config/default
          kustomize edit set image controller=aibrix/controller-manager:${{ github.sha }}
          kustomize edit set image gateway-plugins=aibrix/gateway-plugins:${{ github.sha }}
          kustomize edit set image metadata-service=aibrix/metadata-service:${{ github.sha }}
          cd ${{ github.workspace }}
          kubectl apply -k config/test

      - name: Deploy mock workload
        run: |
          cd development/app/config/mock
          kustomize edit set image aibrix/vllm-mock=aibrix/vllm-mock:${{ github.sha }}
          kustomize edit set image aibrix/runtime=aibrix/runtime:${{ github.sha }}
          kubectl apply -k .

      - name: Wait for pods and open port forwards
        run: |
          sleep 60s
          
          # Verify the mock deployment status.
          # This pod runs two containers: `llm-engine` (app) and `aibrix-runtime` (sidecar).
          # We iterate on the runtime often; missing Poetry deps or startup errors
          # can cause CrashLoopBackOff. Make CI failures self-diagnosable by:
          #  1) describing the pod to capture conditions/events, and
          #  2) dumping the *previous* crash logs from `aibrix-runtime`.
          kubectl get pods --all-namespaces
          kubectl wait pod --all --for=condition=ready --all-namespaces --timeout=600s

          kubectl port-forward svc/llama2-7b 8000:8000 &
          kubectl -n envoy-gateway-system port-forward service/envoy-aibrix-system-aibrix-eg-903790dc  8888:80 &
          kubectl -n aibrix-system port-forward service/aibrix-redis-master 6379:6379 &

      # The installation smoke suite runs on the cluster installed above, so
      # the Kustomize installation is not set up again in a job of its own.
      - name: Run installation smoke test
        run: |
          kind get kubeconfig --name installation-test > /tmp/admin.conf
          export KUBECONFIG=/tmp/admin.conf
          make test-install-smoke

      - name: Run installation e2e tests
        run: |
          kind get kubeconfig --name installation-test > /tmp/admin.conf
          export KUBECONFIG=/tmp/admin.conf
          export AIBRIX_ROLESET_INPLACE_E2E=true
          export AIBRIX_ROLESET_HISTORICAL_NODE_E2E=true
          export AIBRIX_ROLESET_DRAIN_E2E=true
          export AIBRIX_SCHEDULED_BOUNDS_E2E=true
          export AIBRIX_ROLESET_CONTROLLER_DEPLOYMENT=aibrix-controller-manager
          make test-e2e
          export EXTERNAL_METRICS_E2E_CLUSTER=kind
          export EXTERNAL_METRICS_E2E_USE_EXISTING_CONTROLLER=true
          export KIND_CLUSTER_NAME=installation-test
          make test-e2e-external-metrics

      - name: Diagnose installation e2e failure
        if: failure()
        run: |
          kind get kubeconfig --name installation-test > /tmp/admin.conf
          export KUBECONFIG=/tmp/admin.conf

          echo "=== Pods ==="
          kubectl get pods --all-namespaces -o wide || true

          echo "=== Events ==="
          kubectl get events --all-namespaces --sort-by='.lastTimestamp' || true

          echo "=== HTTPRoutes ==="
          kubectl get httproutes.gateway.networking.k8s.io --all-namespaces -o yaml || true

          echo "=== EndpointSlices ==="
          kubectl get endpointslices --all-namespaces -o wide || true

          echo "=== ModelAdapters ==="
          kubectl get modeladapters --all-namespaces -o yaml || true

          echo "=== Gateway logs ==="
          kubectl logs -n aibrix-system -l app=gateway-plugins --all-containers --since=20m || true

          echo "=== Controller logs ==="
          kubectl logs -n aibrix-system -l control-plane=controller-manager --all-containers --since=20m || true

      - name: Clean up
        if: always()
        continue-on-error: true
        run: kind delete cluster --name installation-test || true

      - name: Set up Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Run mock app tests
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --upgrade pip
          pip install -r development/app/requirements.txt pytest
          pytest development/app/test_auth_e2e.py development/app/test_elastic_ep.py -q
