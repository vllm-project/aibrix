name: 💬 Request for Comments (RFC)
description: Propose and discuss major architectural changes or design choices for AIBrix
title: "[RFC]: "
labels: ["kind/feature"]
body:
- type: markdown
  attributes:
    value: >
      #### Before submitting an RFC, please review previous RFCs for context and to avoid duplication.
- type: textarea
  attributes:
    label: Summary
    description: >
      Provide a brief overview of the proposed change or design decision.
  validations:
    required: true
- type: textarea
  attributes:
    label: Motivation
    description: >
      Explain the rationale behind this RFC. What problem does it solve? 
      How does it improve AIBrix's GenAI inference infrastructure?
  validations:
    required: true
- type: textarea
  attributes:
    label: Proposed Change
    description: >
      Describe the proposed change in detail. Include technical specifics, 
      potential implementation approaches, and how it integrates with existing AIBrix components.
  validations:
    required: true
- type: textarea
  attributes:
    label: Alternatives Considered
    description: >
      Discuss any alternative approaches you've considered and why they were not chosen.
  validations:
    required: false
- type: dropdown
  id: area
  attributes:
    label: Area
    description: >
      Which part of AIBrix does this affect? Leave as "Not sure" if you don't know - a maintainer will triage it. This is used to apply an `area/*` label instead of guessing from keywords in this report.
    options:
      - "Not sure"
      - "gateway — routing, Envoy"
      - "orchestration — controllers, CRDs, ModelAdapter/ModelClaim"
      - "runtime — Python runtime, downloader, metadata-service"
      - "kv-cache — distributed KV cache"
      - "batch"
      - "website — docs, console/UI"
      - "cicd — GitHub Actions, workflows"
      - "installation — Helm charts"
      - "testing — e2e, integration"
    default: 0
- type: markdown
  attributes:
    value: >
      Thank you for contributing to AIBrix's development! Your input helps shape the future of our GenAI inference infrastructure. 🎉