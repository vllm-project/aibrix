# AIBrix Gateway Endpoints Configuration - P/D Disaggregation Mode
# This file defines separate prefill and decode engines.
#
# prefill_workers and decode_workers form a single roleset (named "default").
# The PD routing algorithm selects the roleset first and then the best
# prefill+decode pair within it. A roleset serves traffic only when both
# sides have at least one worker.
# For multiple rolesets, use the rolesets: form instead.
#
# NETWORKING:
# Uses hostnames that work for both Docker Compose and local development.
# For local dev, add to /etc/hosts: 127.0.0.1 gateway prefill-engine decode-engine metadata-service

models:
  - name: "Qwen/Qwen2.5-1.5B-Instruct"
    prefill_workers:
      - "prefill-engine:8000"
    decode_workers:
      - "decode-engine:8000"
