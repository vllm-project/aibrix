# Replaces vLLM with the AIBrix mock server so the stack runs without a GPU.
# Used by the compose smoke test (#3631):
#   docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d --wait
services:
  vllm:
    image: aibrix/vllm-mock:${AIBRIX_VERSION:-nightly}
    deploy: !reset {}
    volumes: !reset []
    environment:
      STANDALONE_MODE: "true"
      MODEL_NAME: ${MODEL_NAME:-Qwen/Qwen2.5-1.5B-Instruct}
    command: ["python", "app.py"]
    healthcheck:
      interval: 5s
      start_period: 10s
