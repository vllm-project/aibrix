apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../../config/namespace
  - ../../../../../config/crd/orchestration
  - ../../../../../config/rbac/orchestration
  - ../../../../../config/rbac/controller-manager
  - ../../../../../config/manager

namespace: aibrix-system
namePrefix: aibrix-

images:
  - name: controller
    newName: aibrix/controller-manager
    newTag: nightly

patches:
  - path: manager_patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: controller-manager
