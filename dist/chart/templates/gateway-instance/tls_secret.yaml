{{- if and .Values.gateway.enable (not .Values.gateway.envoyAsSideCar) .Values.gateway.tls.enabled .Values.gateway.tls.autoGenerate }}
{{- $secretName := required "gateway.tls.secretName is required when gateway.tls.enabled=true" .Values.gateway.tls.secretName }}
{{- $hostname := required "gateway.tls.hostname is required when gateway.tls.autoGenerate=true." .Values.gateway.tls.hostname }}
{{- $validityDays := int (.Values.gateway.tls.validityDays | default 365) }}
{{- $dnsNames := list $hostname }}
{{- if hasPrefix "*." $hostname }}
{{- $dnsNames = append $dnsNames (trimPrefix "*." $hostname) -}}
{{- end -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingAnnotations := dict }}
{{- if and $existingSecret $existingSecret.metadata $existingSecret.metadata.annotations }}
{{- $existingAnnotations = $existingSecret.metadata.annotations -}}
{{- end -}}
{{- $hasKeyPair := and $existingSecret (hasKey $existingSecret.data "tls.crt") (hasKey $existingSecret.data "tls.key") }}
{{- $autogenAnnotation := "aibrix.io/tls-autogenerated" }}
{{- $hostnameAnnotation := "aibrix.io/tls-hostname" }}
{{- $validityAnnotation := "aibrix.io/tls-validity-days" }}
{{- $generatedAtAnnotation := "aibrix.io/tls-generated-at" }}
{{- $notAfterAnnotation := "aibrix.io/tls-not-after" }}
{{- $managedSecret := and (hasKey $existingAnnotations $autogenAnnotation) (eq (index $existingAnnotations $autogenAnnotation) "true") }}
{{- $managedHostnameMatches := or (not $managedSecret) (and (hasKey $existingAnnotations $hostnameAnnotation) (eq (index $existingAnnotations $hostnameAnnotation) $hostname)) }}
{{- $managedValidityMatches := or (not $managedSecret) (and (hasKey $existingAnnotations $validityAnnotation) (eq (index $existingAnnotations $validityAnnotation) (printf "%d" $validityDays))) }}
{{- $managedNotExpired := not $managedSecret }}
{{- if and $managedSecret (hasKey $existingAnnotations $notAfterAnnotation) }}
{{- $managedNotExpired = gt (unixEpoch (mustToDate "2006-01-02T15:04:05Z07:00" (index $existingAnnotations $notAfterAnnotation))) (unixEpoch now) -}}
{{- end -}}
{{- $reuseExisting := and $hasKeyPair $managedHostnameMatches $managedValidityMatches $managedNotExpired }}
{{- $generatedCert := "" }}
{{- if not $reuseExisting }}
{{- $generatedCert = genSelfSignedCert $hostname nil $dnsNames $validityDays -}}
{{- end -}}
{{- $generatedAt := "" }}
{{- $notAfter := "" }}
{{- if $reuseExisting }}
  {{- if and $managedSecret (hasKey $existingAnnotations $generatedAtAnnotation) }}
    {{- $generatedAt = index $existingAnnotations $generatedAtAnnotation -}}
  {{- end -}}
  {{- if and $managedSecret (hasKey $existingAnnotations $notAfterAnnotation) }}
    {{- $notAfter = index $existingAnnotations $notAfterAnnotation -}}
  {{- end -}}
{{- else }}
  {{- $generatedAt = dateInZone "2006-01-02T15:04:05Z07:00" now "UTC" -}}
  {{- $notAfter = dateInZone "2006-01-02T15:04:05Z07:00" (dateModify (printf "+%dh" (mul $validityDays 24)) now) "UTC" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aibrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aibrix-gateway
  {{- if or (not $reuseExisting) $managedSecret }}
  annotations:
    {{ $autogenAnnotation }}: "true"
    {{ $hostnameAnnotation }}: {{ $hostname | quote }}
    {{ $validityAnnotation }}: {{ printf "%d" $validityDays | quote }}
    {{ $generatedAtAnnotation }}: {{ $generatedAt | quote }}
    {{ $notAfterAnnotation }}: {{ $notAfter | quote }}
  {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ if $reuseExisting }}{{ index $existingSecret.data "tls.crt" }}{{ else }}{{ $generatedCert.Cert | b64enc }}{{ end }}
  tls.key: {{ if $reuseExisting }}{{ index $existingSecret.data "tls.key" }}{{ else }}{{ $generatedCert.Key | b64enc }}{{ end }}
{{- end }}
