{{- if and .Values.gateway.enable (not .Values.gateway.envoyAsSideCar) }}
{{- $clientTraffic := .Values.gateway.clientTrafficPolicy | default dict -}}
{{- $connection := $clientTraffic.connection | default dict -}}
{{- $connectionLimit := $connection.connectionLimit | default dict -}}
{{- $hcmIndex := ternary 1 0 (gt (int $connectionLimit.value) 0) -}}
{{- $shutdown := .Values.gateway.envoyProxy.gracefulShutdown | default dict }}
{{- if $shutdown.enabled }}
{{- /* Budget for the shutdown-manager's extra 10s readiness wait in the supported
Envoy Gateway v1.2+ baseline; recheck generated hooks when upgrading EG.
See envoyproxy/gateway v1.2.0 internal/infrastructure/kubernetes/proxy/resource.go,
expectedShutdownManagerArgs. */}}
{{- if or (le (int $shutdown.terminationGracePeriodSeconds) (int (add $shutdown.drainTimeoutSeconds 10))) (le (int $shutdown.drainTimeoutSeconds) (int $shutdown.minDrainDurationSeconds)) }}
{{- fail "gateway.envoyProxy.gracefulShutdown requires terminationGracePeriodSeconds > drainTimeoutSeconds + 10 and drainTimeoutSeconds > minDrainDurationSeconds." }}
{{- end }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ include "aibrix.fullname" . }}-eg
  labels:
    {{- include "aibrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aibrix-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ include "aibrix.fullname" . }}-custom-proxy-config
    namespace: {{ .Release.Namespace }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "aibrix.fullname" . }}-eg
  labels:
    {{- include "aibrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aibrix-gateway
spec:
  gatewayClassName: {{ include "aibrix.fullname" . }}-eg
  listeners:
    {{- if .Values.gateway.http.enabled }}
    - name: http
      protocol: HTTP
      port: 80
    {{- end }}
    {{- if .Values.gateway.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: {{ .Values.gateway.tls.port }}
      {{- with .Values.gateway.tls.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: {{ required "gateway.tls.secretName is required when gateway.tls.enabled=true" .Values.gateway.tls.secretName }}
    {{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ include "aibrix.fullname" . }}-custom-proxy-config
  labels:
    {{- include "aibrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aibrix-gateway
spec:
{{- if or .Values.openTelemetry.enable .Values.gateway.envoyProxy.accessLog.enabled }}
  telemetry:
    {{- if .Values.gateway.envoyProxy.accessLog.enabled }}
    accessLog:
      {{- include "aibrix.gateway.diagnosticAccessLog" . | nindent 6 }}
    {{- end }}
    {{- if .Values.openTelemetry.enable }}
    tracing:
      samplingRate: {{ .Values.openTelemetry.samplingRate | default 100 }}
      provider:
        type: OpenTelemetry
        {{- if .Values.openTelemetry.serviceName }}
        backendRefs:
          - name: {{ .Values.openTelemetry.serviceName }}
            {{- if .Values.openTelemetry.namespace }}
            namespace: {{ .Values.openTelemetry.namespace }}
            {{- end }}
            port: {{ .Values.openTelemetry.port | default 4317 }}
        {{- else }}
        host: {{ .Values.openTelemetry.host | quote }}
        port: {{ .Values.openTelemetry.port | default 4317 }}
        {{- end }}
    {{- end }}
{{- end }}
  {{- if $shutdown.enabled }}
  shutdown:
    drainTimeout: {{ printf "%ds" (int $shutdown.drainTimeoutSeconds) }}
    minDrainDuration: {{ printf "%ds" (int $shutdown.minDrainDurationSeconds) }}
  {{- end }}
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas:  {{ .Values.gateway.envoyProxy.replicas }}
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: {{ ternary 0 1 ($shutdown.enabled | default false) }}
            maxSurge: 1
        pod:
          {{- with .Values.gateway.envoyProxy.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.gateway.envoyProxy.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        patch:
          type: StrategicMerge
          value:
            spec:
              {{- if $shutdown.enabled }}
              minReadySeconds: 10
              {{- end }}
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: envoy
                    app.kubernetes.io/component: proxy
                spec:
                  {{- if $shutdown.enabled }}
                  terminationGracePeriodSeconds: {{ $shutdown.terminationGracePeriodSeconds }}
                  {{- end }}
                  {{- include "aibrix.imagePullSecrets" (dict "componentSecrets" .Values.gateway.envoyProxy.imagePullSecrets "globalSecrets" .Values.global.imagePullSecrets) | nindent 18 }}
                  containers:
                    - name: envoy
                      image: {{ .Values.gateway.envoyProxy.container.envoy.image }}
                      resources: {{ toYaml .Values.gateway.envoyProxy.container.envoy.resources | nindent 24 }}
                    - name: shutdown-manager
                      image: {{ .Values.gateway.envoyProxy.container.shutdownManager.image }}
                      resources: {{ toYaml .Values.gateway.envoyProxy.container.shutdownManager.resources | nindent 24 }}
      {{- with .Values.gateway.envoyProxy.service }}
      {{- $service := deepCopy . }}
      {{- $nodePorts := get $service "nodePorts" | default (dict) }}
      {{- $_ := unset $service "nodePorts" }}
      {{- $ports := list }}
      {{- if and $.Values.gateway.http.enabled (get $nodePorts "http") }}
        {{- $ports = append $ports (dict "port" 80 "protocol" "TCP" "nodePort" (int $nodePorts.http)) }}
      {{- end }}
      {{- if and $.Values.gateway.tls.enabled (get $nodePorts "https") }}
        {{- $ports = append $ports (dict "port" (int $.Values.gateway.tls.port) "protocol" "TCP" "nodePort" (int $nodePorts.https)) }}
      {{- end }}
      {{- /* Unpatched listener ports remain managed by Envoy Gateway. */}}
      {{- if $ports }}
        {{- $_ := set $service "patch" (dict "type" "StrategicMerge" "value" (dict "spec" (dict "ports" $ports))) }}
      {{- end }}
      envoyService:
        {{- toYaml $service | nindent 8 }}
      {{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "aibrix.fullname" . }}-client-connection-buffersize
  labels:
    {{- include "aibrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aibrix-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "aibrix.fullname" . }}-eg
  {{- if or $connection.bufferLimit (hasKey $connectionLimit "value") }}
  connection:
    {{- with $connection.bufferLimit }}
    bufferLimit: {{ . }}
    {{- end }}
    {{- if hasKey $connectionLimit "value" }}
    connectionLimit:
      value: {{ $connectionLimit.value }}
    {{- end }}
  {{- end }}
  {{- with pick ($clientTraffic.http2 | default dict) "maxConcurrentStreams" }}
  http2:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "aibrix.fullname" . }}-backend-connection-policy
  labels:
    {{- include "aibrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aibrix-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "aibrix.fullname" . }}-eg
  circuitBreaker:
    maxConnections: {{ .Values.gateway.backendTrafficPolicy.circuitBreaker.maxConnections }}
    maxParallelRequests: {{ .Values.gateway.backendTrafficPolicy.circuitBreaker.maxParallelRequests }}
    maxParallelRetries: {{ .Values.gateway.backendTrafficPolicy.circuitBreaker.maxParallelRetries }}
    maxPendingRequests: {{ .Values.gateway.backendTrafficPolicy.circuitBreaker.maxPendingRequests }}
    maxRequestsPerConnection: {{ .Values.gateway.backendTrafficPolicy.circuitBreaker.maxRequestsPerConnection }}
  http2:
    maxConcurrentStreams: {{ .Values.gateway.backendTrafficPolicy.http2.maxConcurrentStreams }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: {{ include "aibrix.fullname" . }}-epp
  labels:
    {{- include "aibrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aibrix-gateway
spec:
  type: "JSONPatch"
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "aibrix.fullname" . }}-eg
  jsonPatches:
    {{- if .Values.gateway.http.enabled }}
    {{- include "aibrix.gateway.routeConfigurationPatch" (dict "root" . "listenerName" "http") | nindent 4 }}
    {{- end }}
    {{- if .Values.gateway.tls.enabled }}
    {{- include "aibrix.gateway.routeConfigurationPatch" (dict "root" . "listenerName" "https") | nindent 4 }}
    {{- end }}
    - type: "type.googleapis.com/envoy.config.cluster.v3.Cluster"
      name: "envoy-patch-policy-override2"
      operation:
        op: add
        path: ""
        value:
          name: original_destination_cluster
          type: ORIGINAL_DST
          original_dst_lb_config:
            use_http_header: true
            http_header_name: "target-pod"
          connect_timeout: {{ .Values.gateway.envoyPatchPolicy.route.connectTimeout }}
          lb_policy: CLUSTER_PROVIDED
          dns_lookup_family: V4_ONLY
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: {{ .Values.gateway.envoyPatchPolicy.circuitBreakers.maxConnections }}
                max_requests: {{ .Values.gateway.envoyPatchPolicy.circuitBreakers.maxRequests }}
                max_pending_requests: {{ .Values.gateway.envoyPatchPolicy.circuitBreakers.maxPendingRequests }}
                track_remaining: {{ .Values.gateway.envoyPatchPolicy.circuitBreakers.trackRemaining | default false }}
    {{- if .Values.gateway.http.enabled }}
    {{- include "aibrix.gateway.listenerPatches" (dict "root" . "listener" "http" "chain" "/default_filter_chain" "index" $hcmIndex) | nindent 4 }}
    {{- end }}
    {{- if .Values.gateway.tls.enabled }}
    {{- include "aibrix.gateway.listenerPatches" (dict "root" . "listener" "https" "chain" "/filter_chains/0" "index" $hcmIndex) | nindent 4 }}
    {{- end }}
{{- end }}
