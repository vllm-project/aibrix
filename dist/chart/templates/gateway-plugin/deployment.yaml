{{- if or .Values.gateway.enable .Values.gateway.envoyAsSideCar }}
{{- $redisHost := default (printf "%s-redis-master" (include "aibrix.fullname" .)) .Values.gatewayPlugin.dependencies.redis.host }}
{{- $shutdown := .Values.gatewayPlugin.gracefulShutdown | default dict }}
{{- if $shutdown.enabled }}
{{- if .Values.gateway.envoyAsSideCar }}
{{- fail "gatewayPlugin.gracefulShutdown requires gateway.envoyAsSideCar=false; sidecar termination ordering is not covered." }}
{{- end }}
{{- if le (int $shutdown.timeoutSeconds) (int $shutdown.propagationDelaySeconds) }}
{{- fail "gatewayPlugin.gracefulShutdown requires timeoutSeconds > propagationDelaySeconds." }}
{{- end }}
{{- if lt (int $shutdown.terminationGracePeriodSeconds) (int (add $shutdown.timeoutSeconds $shutdown.grpcDrainTimeoutSeconds 10)) }}
{{- fail "gatewayPlugin.gracefulShutdown requires terminationGracePeriodSeconds >= timeoutSeconds + grpcDrainTimeoutSeconds + 10 (cleanup reserve)." }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aibrix.fullname" . }}-gateway-plugins
  labels:
    {{- include "aibrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aibrix-gateway-plugin
spec:
  replicas: {{ .Values.gatewayPlugin.replicaCount }}
  selector:
    matchLabels:
      {{- include "aibrix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: aibrix-gateway-plugin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ ternary 0 1 ($shutdown.enabled | default false) }}
      maxSurge: 1
  {{- if $shutdown.enabled }}
  minReadySeconds: 10
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "aibrix.labels" . | nindent 8 }}
        app.kubernetes.io/component: aibrix-gateway-plugin
    spec:
      {{- if $shutdown.enabled }}
      terminationGracePeriodSeconds: {{ $shutdown.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.gatewayPlugin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - {{ include "aibrix.name" . }}
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - aibrix-gateway-plugin
                topologyKey: "kubernetes.io/hostname"
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: NotIn
                    values:
                      - "true"
      {{- include "aibrix.imagePullSecrets" (dict "componentSecrets" .Values.gatewayPlugin.imagePullSecrets "globalSecrets" .Values.global.imagePullSecrets) | nindent 6 }}
      initContainers:
        - name: init-c
          image: {{ .Values.gatewayPlugin.initContainer.image.repository }}:{{ .Values.gatewayPlugin.initContainer.image.tag }}
          imagePullPolicy: {{ .Values.gatewayPlugin.initContainer.image.imagePullPolicy | default "IfNotPresent" }}
          {{- if include "aibrix.redis.connectionHasPassword" (dict "Values" .Values "component" "gatewayPlugin") }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aibrix.fullname" . }}-redis
                  key: {{ include "aibrix.redis.connectionPasswordKey" (dict "component" "gatewayPlugin") }}
          command: ['sh', '-c', 'until printf ''AUTH %s\nping\n'' "$REDIS_PASSWORD" | nc {{ $redisHost }} {{ .Values.gatewayPlugin.dependencies.redis.port }} -w 1 | grep -c PONG; do echo waiting for redis; sleep 2; done']
          {{- else }}
          command: ['sh', '-c', 'until echo "ping" | nc {{ $redisHost }} {{ .Values.gatewayPlugin.dependencies.redis.port }} -w 1 | grep -c PONG; do echo waiting for redis; sleep 2; done']
          {{- end }}
      containers:
        - name: gateway-plugin
          image: {{ .Values.gatewayPlugin.container.image.repository }}:{{ .Values.gatewayPlugin.container.image.tag }}
          imagePullPolicy: {{ .Values.gatewayPlugin.container.image.imagePullPolicy | default "IfNotPresent" }}
          {{- if $shutdown.enabled }}
          args:
            - {{ printf "--graceful-shutdown-timeout=%ds" (int $shutdown.grpcDrainTimeoutSeconds) | quote }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /gateway-plugins
                  - prestop
                  - {{ printf "--metrics-url=%s" $shutdown.metricsURL | quote }}
                  - {{ printf "--propagation-delay=%ds" (int $shutdown.propagationDelaySeconds) | quote }}
                  - {{ printf "--timeout=%ds" (int $shutdown.timeoutSeconds) | quote }}
                  - {{ printf "--poll-interval=%ds" (int $shutdown.pollIntervalSeconds) | quote }}
          {{- end }}
          # Optional API server client throttling (client-go defaults shown).
          # Both values must be greater than zero and apply to the core
          # Kubernetes and Gateway API clients, each with its own limiter.
          # args:
          #   - --kube-api-qps=5
          #   - --kube-api-burst=10
          ports:
            - name: gateway
              containerPort: 50052
            - name: profiling
              containerPort: 6060
            - name: metrics
              containerPort: 8080
          env:
            - name: REDIS_HOST
              value: {{ $redisHost }}
            - name: REDIS_PORT
              value: "{{ .Values.gatewayPlugin.dependencies.redis.port }}"
            {{- if include "aibrix.redis.connectionHasPassword" (dict "Values" .Values "component" "gatewayPlugin") }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aibrix.fullname" . }}-redis
                  key: {{ include "aibrix.redis.connectionPasswordKey" (dict "component" "gatewayPlugin") }}
            {{- end }}
            {{- $bearerToken := dig "auth" "bearerToken" "" .Values.gatewayPlugin }}
            {{- if $bearerToken }}
            - name: AIBRIX_AUTH_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aibrix.fullname" . }}-gateway-plugin-auth
                  key: bearer-token
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
{{- if and .Values.gateway.envoyAsSideCar (not (hasKey .Values.gatewayPlugin.container.envs "ROUTING_ALGORITHM")) }}
            - name: ROUTING_ALGORITHM
              value: "random"
{{- end }}
{{- range $key, $val := .Values.gatewayPlugin.container.envs }}
            - name: {{ $key }}
              value: "{{ $val }}"
{{- end }}
          resources: {{ toYaml .Values.gatewayPlugin.container.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.gatewayPlugin.container.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.gatewayPlugin.container.probes.readiness | nindent 12 }}
{{- if .Values.gateway.envoyAsSideCar }}
        - name: envoy
          image: {{ .Values.gateway.envoyProxy.container.envoy.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec /usr/local/bin/envoy \
                -c /etc/envoy/envoy.yaml \
                --service-cluster envoy-sidecar \
                --log-level warn \
                --cpuset-threads \
                --drain-strategy immediate \
                --drain-time-s 60
          volumeMounts:
            - name: {{ include "aibrix.fullname" . }}-envoy-config
              mountPath: /etc/envoy
{{- end }}
{{- if .Values.gateway.envoyAsSideCar }}
      volumes:
        - name: {{ include "aibrix.fullname" . }}-envoy-config
          configMap:
            name: {{ include "aibrix.fullname" . }}-envoy-config
            items:
              - key: envoy.yaml
                path: envoy.yaml
{{- end }}
      serviceAccountName: {{ include "aibrix.gatewayPlugin.serviceAccountName" . }}
{{- end }}
