suite: Common Kubernetes Labels
templates:
  - "templates/**/*.yaml"
tests:
  - it: should set common labels on all rendered resources
    documentSelector:
      path: kind                # only docs that have `kind:` (real manifests)
      matchMany: true           # assert on every matching doc
      skipEmptyTemplates: true  # skip empty templates
    asserts:
      - exists:
          path: metadata.labels["app.kubernetes.io/name"]
      - exists:
          path: metadata.labels["app.kubernetes.io/instance"]
      - exists:
          path: metadata.labels["app.kubernetes.io/managed-by"]

  # envoy_config.yaml renders only when the gateway is off and the sidecar is on.
  - it: should set common labels when the sidecar Envoy ConfigMap is rendered
    set:
      gateway.enable: false
      gateway.envoyAsSideCar: true
    documentSelector:
      path: kind                # only docs that have `kind:` (real manifests)
      matchMany: true           # assert on every matching doc
      skipEmptyTemplates: true  # skip empty templates
    asserts:
      - exists:
          path: metadata.labels["app.kubernetes.io/name"]
      - exists:
          path: metadata.labels["app.kubernetes.io/instance"]
      - exists:
          path: metadata.labels["app.kubernetes.io/managed-by"]

  # The Redis password Secret renders only when a password is configured.
  - it: should set common labels when the Redis password Secret is rendered
    set:
      metadata.redis.password: "dddd"
    documentSelector:
      path: kind                # only docs that have `kind:` (real manifests)
      matchMany: true           # assert on every matching doc
      skipEmptyTemplates: true  # skip empty templates
    asserts:
      - exists:
          path: metadata.labels["app.kubernetes.io/name"]
      - exists:
          path: metadata.labels["app.kubernetes.io/instance"]
      - exists:
          path: metadata.labels["app.kubernetes.io/managed-by"]
