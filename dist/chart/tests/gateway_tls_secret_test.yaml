suite: Test Gateway TLS Self-Signed Secret Rendering
templates:
  - gateway-instance/tls_secret.yaml
tests:
  - it: should render a self-signed TLS secret when autoGenerate is enabled
    set:
      gateway.enable: true
      gateway.envoyAsSideCar: false
      gateway.http.enabled: false
      gateway.tls.enabled: true
      gateway.tls.autoGenerate: true
      gateway.tls.hostname: "*.example.com"
      gateway.tls.secretName: "aibrix-gateway-tls"
      gateway.tls.validityDays: 365
    release:
      namespace: aibrix-system
    documentSelector:
      path: kind
      value: Secret
    asserts:
      - equal:
          path: kind
          value: Secret
      - equal:
          path: type
          value: kubernetes.io/tls
      - equal:
          path: metadata.name
          value: aibrix-gateway-tls
      - equal:
          path: metadata.namespace
          value: aibrix-system
      - matchRegex:
          path: data["tls.crt"]
          pattern: ".+"
      - matchRegex:
          path: data["tls.key"]
          pattern: ".+"

  - it: should not render a TLS secret when autoGenerate is disabled
    set:
      gateway.enable: true
      gateway.envoyAsSideCar: false
      gateway.http.enabled: false
      gateway.tls.enabled: true
      gateway.tls.autoGenerate: false
      gateway.tls.hostname: "*.example.com"
      gateway.tls.secretName: "aibrix-gateway-tls"
    asserts:
      - hasDocuments:
          count: 0
---
suite: Test Gateway TLS Self-Signed Validation
templates:
  - validate.yaml
tests:
  - it: should fail when autoGenerate is enabled without hostname
    set:
      gateway.enable: true
      gateway.envoyAsSideCar: false
      gateway.http.enabled: false
      gateway.tls.enabled: true
      gateway.tls.autoGenerate: true
      gateway.tls.hostname: ""
      gateway.tls.secretName: "aibrix-gateway-tls"
    asserts:
      - failedTemplate:
          errorMessage: "gateway.tls.hostname is required when gateway.tls.autoGenerate=true."

  - it: should fail when TLS is enabled without a secret name
    set:
      gateway.enable: true
      gateway.envoyAsSideCar: false
      gateway.http.enabled: false
      gateway.tls.enabled: true
      gateway.tls.secretName: ""
    asserts:
      - failedTemplate:
          errorMessage: "gateway.tls.secretName is required when gateway.tls.enabled=true."

  - it: should fail when both HTTP and TLS listeners are disabled
    set:
      gateway.enable: true
      gateway.envoyAsSideCar: false
      gateway.http.enabled: false
      gateway.tls.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "at least one of gateway.http.enabled or gateway.tls.enabled must be true when gateway.enable=true and gateway.envoyAsSideCar=false."
