apiVersion: autoscaling.aibrix.ai/v1alpha1
kind: PodAutoscaler
metadata:
  name: podautoscaler-example-kpa
  labels:
    app.kubernetes.io/name: aibrix
    app.kubernetes.io/managed-by: kustomize
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-deployment
  minReplicas: 1
  maxReplicas: 10
  observeWindowSeconds: 600
  panicWindowSeconds: 60
  metricsSources:
    - metricSourceType: "resource"
      targetMetric: "cpu"
      targetValue: "10"
  scalingStrategy: "KPA"
