# Namespace existence cannot be checked through a namespaced Role. Permit GET
# on exactly the configured namespace; never permit namespace LIST or WATCH.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-namespace-reader
rules:
- apiGroups: [""]
  resources: [namespaces]
  resourceNames: [system]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway-namespace-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gateway-namespace-reader
subjects:
- kind: ServiceAccount
  name: gateway-plugins
  namespace: system
