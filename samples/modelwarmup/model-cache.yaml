# Build an image containing this feature and make it available on target nodes.
# Authorize namespace/node pool membership as described in README.md.
# This HF example reuses the existing warm-runtime-pool.yaml cache mount.
# Apply this resource, wait for its Complete condition, then apply the original
# ModelClaim YAML. Both preparation and runtime images must contain this feature.
# For other backends, reuse the pool's existing downloader cache and credentials;
# share that cache with the Job rather than changing the Claim or its cache settings.
apiVersion: model.aibrix.ai/v1alpha1
kind: ModelWarmup
metadata:
  name: prepare-qwen-cache
  namespace: default
spec:
  mode: Once
  targets:
    - nodeSelector:
        matchLabels:
          resource-pool.aibrix.ai/name: latency-pool
  custom:
    containers:
      - name: prepare
        image: aibrix/runtime:cache-prepare
        imagePullPolicy: IfNotPresent
        command: [aibrix_download]
        args: [--prepare-cache, --model-uri, "huggingface://Qwen/Qwen3-0.6B"]
        env:
          - name: AIBRIX_MODEL_CACHE_METADATA_DIR
            value: /root/.cache/huggingface/.aibrix/download-metadata
        volumeMounts:
          - name: hf-cache
            mountPath: /root/.cache/huggingface
    volumes:
      - name: hf-cache
        hostPath:
          path: /var/cache/aibrix/huggingface
          type: DirectoryOrCreate
  policies:
    parallelism: 2
    jobTimeoutSeconds: 1800
    retryLimit: 1
    ttlSecondsAfterFinished: 3600
