# Build an image containing this feature and make it available on target nodes.
# Authorize namespace/node pool membership as described in README.md.
# Matches the host paths in samples/modelclaim/warm-runtime-pool.yaml.
apiVersion: model.aibrix.ai/v1alpha1
kind: ModelWarmup
metadata:
  name: prepare-qwen-cache
  namespace: default
spec:
  mode: Once
  targets:
    - nodeSelector:
        matchLabels:
          resource-pool.aibrix.ai/name: latency-pool
  custom:
    containers:
      - name: prepare
        image: aibrix/runtime:cache-prepare
        imagePullPolicy: IfNotPresent
        command: [aibrix_prepare_model_cache]
        args: [--model-uri, "huggingface://Qwen/Qwen3-0.6B"]
        env:
          - name: HF_HUB_CACHE
            value: /model-cache/huggingface/hub
          - name: DOWNLOADER_LOCAL_DIR
            value: /model-cache/objects
        volumeMounts:
          - name: hf-cache
            mountPath: /model-cache/huggingface
          - name: object-cache
            mountPath: /model-cache/objects
    volumes:
      - name: hf-cache
        hostPath:
          path: /var/cache/aibrix/huggingface
          type: DirectoryOrCreate
      - name: object-cache
        hostPath:
          path: /var/cache/aibrix/models
          type: DirectoryOrCreate
  policies:
    parallelism: 2
    jobTimeoutSeconds: 1800
    retryLimit: 1
    ttlSecondsAfterFinished: 3600
