# Prerequisites:
# kubectl label namespace default resource-pool.aibrix.ai/name=latency-pool
# kubectl label node <node> resource-pool.aibrix.ai/name=latency-pool \
#   model.aibrix.ai/warmup-enabled=true
apiVersion: model.aibrix.ai/v1alpha1
kind: ModelWarmup
metadata:
  name: model-cache-node-precheck
  namespace: default
spec:
  mode: Once
  targets:
  - nodeSelector:
      matchLabels:
        resource-pool.aibrix.ai/name: latency-pool
  custom:
    volumes:
    - name: model-cache
      hostPath:
        path: /var/lib/aibrix/models
        type: DirectoryOrCreate
    initContainers:
    - name: check-model-cache
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c"]
      args:
      - |
        set -eu
        test -w /models
        available_kib="$(df -Pk /models | awk 'NR == 2 { print $4 }')"
        test "${available_kib:-0}" -ge 1048576
      volumeMounts:
      - name: model-cache
        mountPath: /models
    containers:
    - name: precheck-succeeded
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "exit 0"]
      volumeMounts:
      - name: model-cache
        mountPath: /models
  policies:
    parallelism: 8
    jobTimeoutSeconds: 1800
    retryLimit: 2
    ttlSecondsAfterFinished: 3600
