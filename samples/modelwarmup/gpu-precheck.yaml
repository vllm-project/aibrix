# Prerequisites:
# kubectl label namespace default resource-pool.aibrix.ai/name=latency-pool
# kubectl label node <node> resource-pool.aibrix.ai/name=latency-pool \
#   model.aibrix.ai/warmup-enabled=true
# Target nodes must expose nvidia.com/gpu through the NVIDIA device plugin.
apiVersion: model.aibrix.ai/v1alpha1
kind: ModelWarmup
metadata:
  name: gpu-node-precheck
  namespace: default
spec:
  mode: Once
  targets:
  - nodeSelector:
      matchLabels:
        resource-pool.aibrix.ai/name: latency-pool
  custom:
    initContainers:
    - name: check-gpu
      image: nvidia/cuda:12.4.1-base-ubuntu22.04
      imagePullPolicy: IfNotPresent
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: "1"
    containers:
    - name: precheck-succeeded
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "exit 0"]
  policies:
    parallelism: 8
    jobTimeoutSeconds: 1800
    retryLimit: 2
    ttlSecondsAfterFinished: 3600
