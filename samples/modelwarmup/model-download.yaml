# Prerequisites:
# kubectl label namespace default resource-pool.aibrix.ai/name=latency-pool
# kubectl label node <node> resource-pool.aibrix.ai/name=latency-pool \
#   model.aibrix.ai/warmup-enabled=true
apiVersion: model.aibrix.ai/v1alpha1
kind: ModelWarmup
metadata:
  name: tiny-gpt2-model-download
  namespace: default
spec:
  mode: Once
  targets:
  - nodeSelector:
      matchLabels:
        resource-pool.aibrix.ai/name: latency-pool
  custom:
    volumes:
    - name: model-cache
      hostPath:
        path: /var/lib/aibrix/models
        type: DirectoryOrCreate
    containers:
    - name: download-tiny-gpt2
      image: aibrix/runtime:v0.8.0-rc.1
      imagePullPolicy: IfNotPresent
      command: ["aibrix_download"]
      args:
      - --model-uri
      - sshleifer/tiny-gpt2
      - --local-dir
      - /models/sshleifer-tiny-gpt2
      volumeMounts:
      - name: model-cache
        mountPath: /models
  policies:
    parallelism: 8
    jobTimeoutSeconds: 1800
    retryLimit: 2
    ttlSecondsAfterFinished: 3600
