apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-replica-router
  namespace: aibrix-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: external-replica-router
  template:
    metadata:
      labels:
        app: external-replica-router
    spec:
      containers:
      - name: router
        image: example.com/aibrix/external-replica-router:v1alpha1
        env:
        - name: PREFERRED_ZONE
          value: cn-east-1a
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          tcpSocket:
            port: http
---
apiVersion: v1
kind: Service
metadata:
  name: external-replica-router
  namespace: aibrix-system
spec:
  selector:
    app: external-replica-router
  ports:
  - name: http
    port: 8080
    targetPort: http

