# Encode/Prefill/Decode (EPD) for a multimodal model: one encode, one prefill
# and one decode pod per roleset. The encode pod writes encoder outputs to the
# shared EC cache and the prefill pod reads them, so both mount the same
# storage. The ec-cache claim must be ReadWriteMany, or point both pods at the
# same node path. The decode pod gets its KV from prefill over NIXL and needs
# no EC connector.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ec-cache
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
apiVersion: orchestration.aibrix.ai/v1alpha1
kind: StormService
metadata:
  name: vllm-1e1p1d
spec:
  replicas: 1
  updateStrategy:
    type: InPlaceUpdate
  stateful: true
  selector:
    matchLabels:
      app: vllm-1e1p1d
  template:
    metadata:
      labels:
        app: vllm-1e1p1d
    spec:
      roles:
        - name: encode
          replicas: 1
          stateful: true
          template:
            metadata:
              labels:
                model.aibrix.ai/name: qwen2.5-vl-3b
                model.aibrix.ai/port: "8000"
                model.aibrix.ai/engine: vllm
            spec:
              containers:
                - name: encode
                  image: vllm/vllm-openai:v0.31.0
                  command: ["sh", "-c"]
                  args:
                    - |
                      vllm serve Qwen/Qwen2.5-VL-3B-Instruct \
                      --host "0.0.0.0" \
                      --port "8000" \
                      --served-model-name qwen2.5-vl-3b \
                      --enforce-eager \
                      --no-enable-prefix-caching \
                      --mm-encoder-only \
                      --max-num-batched-tokens 65536 \
                      --ec-transfer-config '{"ec_connector":"ECExampleConnector","ec_role":"ec_producer","ec_connector_extra_config":{"shared_storage_path":"/ec-cache"}}'
                  volumeMounts:
                    - name: ec-cache
                      mountPath: /ec-cache
                    - name: shared-mem
                      mountPath: /dev/shm
                  resources:
                    limits:
                      nvidia.com/gpu: 1
              volumes:
                - name: ec-cache
                  persistentVolumeClaim:
                    claimName: ec-cache
                - name: shared-mem
                  emptyDir:
                    medium: Memory
        - name: prefill
          replicas: 1
          stateful: true
          template:
            metadata:
              labels:
                model.aibrix.ai/name: qwen2.5-vl-3b
                model.aibrix.ai/port: "8000"
                model.aibrix.ai/engine: vllm
            spec:
              containers:
                - name: prefill
                  image: vllm/vllm-openai:v0.31.0
                  command: ["sh", "-c"]
                  args:
                    - |
                      vllm serve Qwen/Qwen2.5-VL-3B-Instruct \
                      --host "0.0.0.0" \
                      --port "8000" \
                      --served-model-name qwen2.5-vl-3b \
                      --enforce-eager \
                      --ec-transfer-config '{"ec_connector":"ECExampleConnector","ec_role":"ec_consumer","ec_connector_extra_config":{"shared_storage_path":"/ec-cache"}}' \
                      --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
                  env:
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      value: "0.0.0.0"
                    - name: VLLM_NIXL_SIDE_CHANNEL_PORT
                      value: "5558"
                  volumeMounts:
                    - name: ec-cache
                      mountPath: /ec-cache
                    - name: shared-mem
                      mountPath: /dev/shm
                  resources:
                    limits:
                      nvidia.com/gpu: 1
              volumes:
                - name: ec-cache
                  persistentVolumeClaim:
                    claimName: ec-cache
                - name: shared-mem
                  emptyDir:
                    medium: Memory
        - name: decode
          replicas: 1
          stateful: true
          template:
            metadata:
              labels:
                model.aibrix.ai/name: qwen2.5-vl-3b
                model.aibrix.ai/port: "8000"
                model.aibrix.ai/engine: vllm
            spec:
              containers:
                - name: decode
                  image: vllm/vllm-openai:v0.31.0
                  command: ["sh", "-c"]
                  args:
                    - |
                      vllm serve Qwen/Qwen2.5-VL-3B-Instruct \
                      --host "0.0.0.0" \
                      --port "8000" \
                      --served-model-name qwen2.5-vl-3b \
                      --enforce-eager \
                      --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
                  env:
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      value: "0.0.0.0"
                    - name: VLLM_NIXL_SIDE_CHANNEL_PORT
                      value: "5558"
                  volumeMounts:
                    - name: shared-mem
                      mountPath: /dev/shm
                  resources:
                    limits:
                      nvidia.com/gpu: 1
              volumes:
                - name: shared-mem
                  emptyDir:
                    medium: Memory
