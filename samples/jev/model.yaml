# A Jev-compatible decision model: SGLang serving POST /v1/systemone behind the
# AIBrix gateway. Adapted from ../quickstart/vke/model.yaml; see README.md.
#
# The model is named `jev-latest`, the default model name of the TypeSafe SDKs.
# The gateway routes on the request's `model` and answers 400 model_not_found for
# a name that no pod advertises, so naming the deployment this lets an SDK client
# work without setting a model. Rename it (the Deployment name, both
# `model.aibrix.ai/name` labels, `--served-model-name` and the Service) if you
# would rather send your own model name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jev-latest
  labels:
    model.aibrix.ai/name: jev-latest
    model.aibrix.ai/port: "8000"
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      model.aibrix.ai/name: jev-latest
  template:
    metadata:
      labels:
        model.aibrix.ai/name: jev-latest
        model.aibrix.ai/port: "8000"
        model.aibrix.ai/engine: sglang
      annotations:
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
        prometheus.io/scrape: "true"
    spec:
      initContainers:
        # SGLang answers /v1/systemone from any chat model that has a Jinja chat
        # template and does not always open with a reasoning block. Qwen3.8-27B is
        # one SGLang validates, on a single H200 in BF16. Its weights are about
        # 54 GB, so the first start takes a while.
        #
        # No DOWNLOADER_ALLOW_FILE_SUFFIX filter, unlike the base sample: the chat
        # template may be a separate .jinja file, and SGLang refuses the route
        # without one. If the cluster cannot reach huggingface.co, set HF_ENDPOINT
        # to a mirror, or stage the weights in TOS and use the tos:// form of
        # --model-uri from ../quickstart/vke/model.yaml. For a gated repository,
        # set HF_TOKEN from a secret the same way. Add either under `env:` here.
        - command:
            - aibrix_download
            - --model-uri
            - Qwen/Qwen3.8-27B
            # Without this the weights land in /models/Qwen/Qwen3.8-27B.
            - --model-name
            - Qwen3.8-27B
            - --local-dir
            - /models/
          image: aibrix-public-release-cn-beijing.cr.volces.com/aibrix/runtime:v0.8.0-rc.1
          name: init-model
          volumeMounts:
            - mountPath: /models
              name: model-hostpath
      containers:
        - name: sglang
          image: aibrix-container-registry-cn-beijing.cr.volces.com/aibrix/sglang:v0.5.21
          imagePullPolicy: Always
          command:
            - python3
            - -m
            - sglang.launch_server
            - --model-path
            - /models/Qwen3.8-27B
            - --served-model-name
            - jev-latest
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --enable-metrics
          volumeMounts:
            - mountPath: /models
              name: model-hostpath
            - mountPath: /dev/shm
              name: shared-mem
          resources:
            limits:
              nvidia.com/gpu: "1"
              cpu: "16"
              memory: "128G"
            requests:
              nvidia.com/gpu: "1"
              cpu: "16"
              memory: "128G"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            failureThreshold: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          # Loading 27B weights and capturing CUDA graphs takes minutes, so allow
          # 15 minutes where the base sample's 8B model gets 2.5.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            failureThreshold: 180
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
      volumes:
        - name: model-hostpath
          hostPath:
            path: /data01/models/
            type: DirectoryOrCreate
        # SGLang's processes communicate through shared memory, which its docs
        # tell Kubernetes manifests to size up from the container default.
        - name: shared-mem
          emptyDir:
            medium: Memory

---

apiVersion: v1
kind: Service
metadata:
  labels:
    model.aibrix.ai/name: jev-latest
    prometheus-discovery: "true"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
  name: jev-latest # Note: The Service name must match the label value `model.aibrix.ai/name` in the Deployment
  namespace: default
spec:
  ports:
    - name: serve
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    model.aibrix.ai/name: jev-latest
  type: ClusterIP
