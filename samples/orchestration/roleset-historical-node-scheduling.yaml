# Historical-node replacement scheduling keeps replacement Pods close to nodes
# that previously ran the same role workload. This is useful for workloads that
# benefit from warm local state, such as model files, runtime caches, or KV cache
# artifacts left on the node.
#
# Apply the stateful example:
#   kubectl apply -f samples/orchestration/roleset-historical-node-scheduling.yaml
#   kubectl get pods -l roleset-name=roleset-history-stateful -o wide
#
# Then change the image or another Pod-template field that forces replacement:
#   kubectl patch roleset roleset-history-stateful --type=json -p='[
#     {"op":"replace","path":"/spec/roles/0/template/spec/containers/0/image",
#      "value":"registry.k8s.io/e2e-test-images/agnhost:2.54"}
#   ]'
#
# Watch the new Pod. It receives preferred node affinity for the historical node:
#   kubectl get pod -l roleset-name=roleset-history-stateful -o yaml
apiVersion: orchestration.aibrix.ai/v1alpha1
kind: RoleSet
metadata:
  name: roleset-history-stateful
spec:
  updateStrategy: Parallel
  roles:
    - name: worker
      replicas: 1
      stateful: true
      updateStrategy:
        type: Recreate
        maxSurge: 0
        maxUnavailable: 1
        replacementScheduling:
          historicalNode:
            # mode=Preferred means the controller injects preferred hostname
            # node affinity for replacement Pods. It does not require the Pod
            # to run on the historical node if that node has no capacity.
            mode: Preferred
      template:
        spec:
          containers:
            - name: worker
              image: registry.k8s.io/e2e-test-images/agnhost:2.53
              args: ["pause"]
---
# Stateless roles can also use historical-node replacement scheduling during
# rollout replacement. The controller records recent nodes at role scope and
# prefers those nodes for replacement Pods.
#
# Notes:
# - Stateful roles remember nodes per replica slot, for example worker/0.
# - Stateless roles remember a recent-node list per role.
# - Stateless scale-up is not treated as replacement and does not use this
#   history; rollouts and replacement-style updates do.
# - The history is stored in the controller-owned RoleSet annotation
#   orchestration.aibrix.ai/historical-node-bindings and survives controller
#   restarts.
# - If the Pod template already has required node affinity, or the RoleSet has
#   a required hostname topology policy, the controller skips injecting this
#   preferred affinity to avoid conflicting scheduling intent. Check controller
#   logs for the skip reason.
apiVersion: orchestration.aibrix.ai/v1alpha1
kind: RoleSet
metadata:
  name: roleset-history-stateless
spec:
  updateStrategy: Parallel
  roles:
    - name: worker
      replicas: 2
      stateful: false
      updateStrategy:
        type: Recreate
        maxSurge: 1
        maxUnavailable: 0
        replacementScheduling:
          historicalNode:
            mode: Preferred
      template:
        spec:
          containers:
            - name: worker
              image: registry.k8s.io/e2e-test-images/agnhost:2.53
              args: ["pause"]
