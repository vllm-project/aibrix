# Two workers that stand in for the stages behind the head.
#
#   kubectl apply -f samples/orchestration/omni-master-wait/mock-worker.yaml
#
# The init container is the startup gate: the stage does not start until the
# master address answers. The second Pod is the negative control and waits on
# the Service that does not publish not-ready addresses.
#
# The stage container is a stand-in, so it just keeps running: the loop avoids a
# restart from the sleep itself, which would make the restart count meaningless.
#
# The wait does not rely on `nc -z`: stdin redirection gets the same result on
# the busybox build used here, because the connection ends as soon as it opens,
# so the exit code is 0 only when the port answered.
apiVersion: v1
kind: Pod
metadata:
  name: omni-master-wait-worker
  labels:
    app: omni-master-wait-worker
spec:
  initContainers:
    - name: wait-for-master
      image: busybox:1.36
      command:
        - sh
        - -c
        - until nc -w 1 omni-master-wait 26000 < /dev/null; do echo waiting; sleep 1; done; echo connected
  containers:
    - name: stage
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo stage-started; while true; do sleep 3600; done
---
apiVersion: v1
kind: Pod
metadata:
  name: omni-master-wait-worker-normal
  labels:
    app: omni-master-wait-worker-normal
spec:
  initContainers:
    - name: wait-for-master
      image: busybox:1.36
      command:
        - sh
        - -c
        - until nc -w 1 omni-master-wait-normal 26000 < /dev/null; do echo waiting; sleep 1; done; echo connected
  containers:
    - name: stage
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo stage-started; while true; do sleep 3600; done
